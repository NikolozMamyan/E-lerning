# config/services.yaml

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    uploads_directory: '%kernel.project_dir%/public/uploads/avatars'
    profile_covers_directory: '%kernel.project_dir%/public/uploads/covers'
    job_application_cvs_directory: '%kernel.project_dir%/var/private/job-applications'
    articles_dir: '%kernel.project_dir%/public/uploads/articles'
    videos_dir: '%kernel.project_dir%/public/uploads/videos'
    app.scorm.max_package_size: 5153960755
    app.scorm.completion_threshold: 90
    app.scorm.commit_interval_seconds: 10

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\Scorm\ScormPackageGenerator:
        arguments:
            $resourcesDirectory: '%kernel.project_dir%/resources/scorm'
            $temporaryDirectory: '%kernel.cache_dir%/scorm/packages'
            $maxPackageSize: '%app.scorm.max_package_size%'
            $completionThreshold: '%app.scorm.completion_threshold%'
            $commitIntervalSeconds: '%app.scorm.commit_interval_seconds%'

    App\Service\Scorm\LocalVideoPathResolver:
        arguments:
            $publicDirectory: '%kernel.project_dir%/public'

    App\Service\Scorm\CourseScormExportService:
        arguments:
            $exportDirectory: '%kernel.cache_dir%/scorm/exports'

    App\Service\Scorm\BilingualScormExportService:
        arguments:
            $stagingDirectory: '%kernel.cache_dir%/scorm/bilingual-uploads'
            $exportDirectory: '%kernel.cache_dir%/scorm/exports'

    App\Service\Scorm\ScormVideoStorage:
        arguments:
            $publicDirectory: '%kernel.project_dir%/public'
            $maxFileSize: '%app.scorm.max_package_size%'

    App\Service\ProfileCoverStorage:
        arguments:
            $directory: '%profile_covers_directory%'

    App\Service\JobApplicationCvStorage:
        arguments:
            $directory: '%job_application_cvs_directory%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
