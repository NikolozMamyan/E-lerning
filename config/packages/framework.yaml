# config/packages/framework.yaml
framework:
    secret: '%env(APP_SECRET)%'

    # Session (sera démarrée seulement si utilisée)
    session: true

    # ⚡ Localisation
    default_locale: en
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks:
            - en

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
